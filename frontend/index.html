<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Items & Orders Tracker</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>Items &amp; Orders Tracker</h1>
    <nav>
      <button class="tab-btn active" data-tab="orders">Orders</button>
      <button class="tab-btn" data-tab="items">Items</button>
      <button class="tab-btn" data-tab="settings">Settings</button>
    </nav>
  </header>

  <main>
    <!-- ORDERS TAB -->
    <section id="tab-orders" class="tab active">
      <h2>Orders</h2>

      <div class="filters">
        <label>Category
          <select id="filter-category"><option value="">All</option></select>
        </label>
        <label>Location
          <select id="filter-location"><option value="">All</option></select>
        </label>
        <label>From <input type="date" id="filter-date-from" /></label>
        <label>To <input type="date" id="filter-date-to" /></label>
        <button id="btn-clear-filters">Clear filters</button>
      </div>

      <table id="orders-table">
        <thead>
          <tr>
            <th>Order Code</th><th>Category</th><th>Location</th>
            <th>Date</th><th># Lines</th><th>Total</th><th></th>
          </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
          <tr><td colspan="5" style="text-align:right;font-weight:bold;">Grand Total:</td>
              <td id="grand-total" style="font-weight:bold;"></td><td></td></tr>
        </tfoot>
      </table>

      <h3>Add order</h3>
      <form id="form-add-order" class="inline-form">
        <input name="order_code" placeholder="Order code (e.g. ORD-004)" required />
        <select name="category"></select>
        <select name="location"></select>
        <button type="submit">Add order</button>
      </form>

      <h2>Order Lines</h2>
      <label>Viewing lines for order:
        <select id="line-order-select"></select>
      </label>

      <table id="lines-table">
        <thead>
          <tr>
            <th>Date</th><th>Item</th><th>Item Type</th>
            <th>Unit Price</th><th>Qty</th><th>Line Total</th><th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <h3>Add line to selected order</h3>
      <form id="form-add-line" class="inline-form">
        <input type="date" name="order_date" />
        <select name="item_name"></select>
        <input type="number" step="0.01" name="unit_price" placeholder="Unit price" required />
        <input type="number" step="1" name="quantity" placeholder="Qty" value="1" required />
        <button type="submit">Add line</button>
      </form>
    </section>

    <!-- ITEMS TAB -->
    <section id="tab-items" class="tab">
      <h2>Items</h2>
      <table id="items-table">
        <thead><tr><th>Item Name</th><th>Category</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <h3>Add item</h3>
      <form id="form-add-item" class="inline-form">
        <input name="name" placeholder="Item name" required />
        <input name="category" placeholder="Category" />
        <button type="submit">Add item</button>
      </form>
    </section>

    <!-- SETTINGS TAB -->
    <section id="tab-settings" class="tab">
      <h2>Order Categories</h2>
      <table id="categories-table">
        <thead><tr><th>Category</th><th>Status</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <form id="form-add-category" class="inline-form">
        <input name="name" placeholder="Category name" required />
        <select name="status">
          <option>Limited</option>
          <option>Always Active</option>
        </select>
        <button type="submit">Add category</button>
      </form>

      <h2>Order Locations</h2>
      <table id="locations-table">
        <thead><tr><th>Location</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <form id="form-add-location" class="inline-form">
        <input name="name" placeholder="Location name" required />
        <button type="submit">Add location</button>
      </form>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
